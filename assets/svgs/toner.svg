    <!-- Toner indicator lines -->
    <line x1="16" y1="28" x2="20" y2="28"/>
    <line x1="24" y1="28" x2="28" y2="28"/>
    <line x1="32" y1="28" x2="36" y2="28"/>
    <line x1="40" y1="28" x2="44" y2="28"/>
</svg>
