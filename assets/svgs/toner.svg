<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="white" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cartridge body -->
    <rect x="8" y="20" width="48" height="16" rx="2" ry="2"/>

    <!-- Left connector -->
    <rect x="4" y="24" width="4" height="8" rx="1" ry="1"/>

    <!-- Right connector -->
